[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-orders-pipeline"
version = "1.0.0"
description = "Bounded-memory CSV and JSONL order ingestion example"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
orders-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
